<section class="decision-card {% if error %}warning{% else %}success{% endif %}" id="decision-area">{% if error %}<div class="success-mark">!</div><div><h2>No se pudo registrar</h2><p>{{ error }}</p><p>No se envió ningún contacto automático.</p></div>{% else %}<div class="success-mark">✓</div><div><h2>{{ decision_label }}</h2><p>Decisión registrada{% if reviewer %} por {{ reviewer }}{% endif %}. No se envió ningún contacto automático.</p></div>{% endif %}</section>
