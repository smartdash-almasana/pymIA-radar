<aside class="sidebar"><div class="sidebar-title"><h2>Filtros</h2><button type="button" class="text-button" data-reset-filters>Limpiar</button></div><form id="filters-form" hx-get="/htmx/results" hx-target="#workspace" hx-trigger="change delay:150ms"><fieldset><legend>Estado</legend>{% for value,label in [("todos","Todos"),("alta","Alta afinidad aparente"),("revisar","Para revisar"),("observacion","Observación"),("no_contactar","No contactar"),("aprobado","Acercamiento aprobado")] %}<label class="radio-row"><input type="radio" name="status" value="{{ value }}" {% if filters.status == value %}checked{% endif %}><span>{{ label }}</span></label>{% endfor %}</fieldset><label><span>Fuente</span><select name="source">{% for value,label in [("todas","Todas"),("reddit","Reddit"),("facebook","Facebook"),("linkedin","LinkedIn"),("instagram","Instagram"),("x","X"),("github","GitHub"),("youtube","YouTube"),("hackernews","Hacker News")] %}<option value="{{ value }}" {% if filters.source == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label><span>Afinidad aparente</span><select name="affinity">{% for value,label in [("todas","Todas"),("alta","Alta"),("media","Media"),("baja","Nula/baja"),("sin-evaluacion","Sin evaluación")] %}<option value="{{ value }}" {% if filters.affinity == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label><span>Intención aparente</span><select name="intent">{% for value,label in [("todas","Todas"),("accion","Acción declarada"),("exploracion","Exploración"),("simpatia","Simpatía temática"),("ninguna","Sin intención relacionada"),("sin-evaluacion","Sin evaluación")] %}<option value="{{ value }}" {% if filters.intent == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label><span>Riesgo</span><select name="risk">{% for value,label in [("todos","Todos"),("bajo","Bajo"),("medio","Medio"),("alto","Alto"),("sin-evaluacion","Sin evaluación")] %}<option value="{{ value }}" {% if filters.risk == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label></form></aside>
